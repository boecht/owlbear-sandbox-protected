name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/app/package-lock.json
      - run: npm ci && npm test
      - name: License headers
        run: |
          for f in src/*.ts; do
            head -n 1 "$f" | grep -q 'SPDX-License-Identifier: MIT' || { echo "::error file=packages/app/$f::$f lacks '// SPDX-License-Identifier: MIT' as its first line (repository policy)"; exit 1; }
          done
      - name: Owner marker
        env:
          MARKER: ${{ vars.OWNER_MARKER }}
        run: |
          [ -z "$MARKER" ] && exit 0
          for f in src/*.ts; do
            grep -qxF "$MARKER" "$f" || { echo "::error file=packages/app/$f::$f lacks the owner marker line required by repository policy: $MARKER"; exit 1; }
          done
      - name: Owner required lines
        env:
          LINES: ${{ vars.REQUIRED_LINES }}
        run: |
          printf '%s\n' "$LINES" | while IFS='|' read -r f line; do
            [ -z "$f" ] && continue
            grep -qxF "$line" "$f" || { echo "::error file=packages/app/$f::$f must contain the line '$line' (owner policy, repository variable REQUIRED_LINES)"; exit 1; }
          done
